name: GPU equivalence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equivalence:
    name: CPU/GPU equivalence
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: Build the equivalence image
        run: docker build -t rsc-equivalence .

      - name: Run equivalence suite
        id: suite
        continue-on-error: true
        run: docker run --rm --gpus all -v "$PWD/out:/out" rsc-equivalence

      - name: Publish job summary
        if: always()
        run: |
          if [[ -f out/report/summary.md ]]; then
            cat out/report/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The comparison suite did not produce a summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload equivalence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-equivalence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            out/equivalence.json
            out/execution.json
            out/results
            out/report

      - name: Enforce equivalence result
        if: steps.suite.outcome == 'failure'
        run: exit 1
